# Development uses Redis when REDIS_URL is set, as staging and production do.
# Jobs run by Solid Queue workers can then refresh open pages.
development:
  adapter: '<%= ENV["REDIS_URL"].present? ? "redis" : "async" %>'
  url: <%= ENV["REDIS_URL"] %>
  channel_prefix: neighbourly_resources_development

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>
  channel_prefix: neighbourly_resources_production
  ssl_params:
    verify_mode: <%= OpenSSL::SSL::VERIFY_NONE %>
