# The questions asked by "Find help for myself" (/find-help/myself), in order.
#
# This file is the only place a question is described. Questionnaire loads it, and the
# views draw each question from its `type` without knowing which question it is. So
# rewording a question, or adding an option, is an edit here and nowhere else.
#
# Each question has:
#   key      names its answers in the form. Never shown. Changing it is safe, because
#            answers are never saved.
#   title    the question, as people read it.
#   hint     optional: a short line of help under the title.
#   type     how it's asked: "checkboxes" for any number of options, "radio" for one, or
#            "location" for typing a place or using the device's location.
#   filter   which filter class turns the answer into part of the search. Must be listed
#            in Questionnaire::FILTERS. Two questions can't both use CategoryFilter: the
#            second would replace the first instead of narrowing it.
#   requires optional: something ResourceAttributes can read, like age_range. The question is
#            hidden, and not counted as a step, until a visible service has it. At least one
#            question must not have this.
#   options  the choices, for any type but location. Each has a key, a label,
#            and what its filter needs. CategoryFilter matches category names
#            from db/category_names.yml because IDs differ between databases.
#            A checkbox group can list children. Selecting the group includes
#            all categories from its children, plus any categories on the group.
questions:
  - key: categories
    title: What do you need help with?
    hint: Choose as many as you like. Selecting a group includes the options below it.
    type: checkboxes
    filter: CategoryFilter
    options:
      - { key: clothing, label: Clothing, categories: [Clothing] }
      - { key: computer_internet, label: Computer & Internet, categories: [Computer & Internet] }
      - { key: employment, label: Employment Support, categories: [Employment Support] }
      - key: food
        label: Food and meals
        children:
          - { key: food_banks, label: Food Banks, categories: [Food Banks] }
          - { key: meals, label: Meals, categories: [Meals] }
      - key: substance_use
        label: Harm Reduction Resources
        categories: [Harm Reduction Resources]
        children:
          - { key: substance_use_support, label: Substance Use Support, categories: [Substance Use Support] }
          - { key: supervised_consumption, label: Supervised Consumption, categories: [Supervised Consumption] }
      - key: health
        label: Health Care
        categories: [Health Care]
        children:
          - { key: mental_health, label: Mental Health Support, categories: [Mental Health Support] }
      - key: shelter
        label: Housing Services
        categories: [Housing Services]
        children:
          - { key: shelters, label: Shelters, categories: [Shelters] }
      - { key: indigenous, label: Indigenous Support, categories: [Indigenous Support] }
      - { key: legal, label: Legal Support, categories: [Legal Support] }
      - { key: showers, label: Showers, categories: [Showers] }
      - { key: youth, label: Youth Services, categories: [Youth Services] }
  - key: location
    title: Where are you?
    hint: We'll show the closest services first. This is optional, and it isn't saved.
    type: location
    filter: LocationFilter
